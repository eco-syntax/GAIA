# GAIA in one container. See README "Docker install" for the walkthrough.
#
# Files pass to and from the agent through ONE folder:
#   ./workspace  (host)  =  /workspace  (agent)
# The agent's memory and session history live in ./data and survive resets.
# Secrets come from .env (copy .env.example) — never from a file inside.

services:
  gateway:
    # Prebuilt multi-arch image published by the release workflow (ghcr).
    # Developers: build locally with ./docker/build.sh and run with
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    image: ghcr.io/eco-syntax/gaia:latest
    env_file: .env
    environment:
      # The gateway's model server: the llama service below (default), or your
      # own OpenAI-compatible endpoint — override LLAMA_BASE_URL in .env.
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://llama:8080}
    volumes:
      - ./workspace:/workspace
      - ./data:/home/node/.gaia
    restart: unless-stopped

  # Optional local model server: drop a .gguf into ./models and uncomment the
  # model spec in .env. Start with: docker compose --profile llama up -d
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llama"]
    volumes:
      - ./models:/models:ro
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "32768"]
    restart: unless-stopped
